                    ]

        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: #131827;
                color: #f0f3ff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: radial-gradient(
                    ellipse at top,
                    #293e69 0,
                    transparent 65%
                );
            }

            main {
                width: min(1200px, 100%);
                margin: auto;
                padding: 64px 24px;
                text-align: center;
            }

            h1 {
                margin: 0 0 48px;
                color: #a9c7ff;
                font-size: clamp(1.5rem, 4vw, 2.5rem);
                letter-spacing: -0.04em;
            }

            .question {
                margin: 0;
                color: #c5cfe7;
                font-size: clamp(1rem, 3vw, 1.4rem);
            }

            .answer {
                display: inline-block;
                max-width: 100%;
                padding: 0 8px;
                border: 0;
                background: transparent;
                cursor: pointer;
                margin: 8px 0 0;
                color: #ff5c64;
                font-family: "Arial Black", "Segoe UI", sans-serif;
                font-size: clamp(6rem, 20vw, 12rem);
                font-weight: 900;
                -webkit-text-stroke: 2px #ff5c64;
                text-shadow:
                    0 6px 0 #951e39,
                    0 12px 32px #ff394533;
                line-height: 1.1;
                letter-spacing: -0.07em;
            }

            .answer:focus-visible {
                outline: 3px solid #a9c7ff;
                outline-offset: 8px;
                border-radius: 8px;
            }

            .answer.still {
                font-size: clamp(2.5rem, 10vw, 7rem);
                overflow-wrap: anywhere;
            }

            .explosions {
                position: fixed;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
                z-index: 2;
            }

            .explosions .burst {
                position: absolute;
                left: var(--x);
                top: var(--y);
                font-size: clamp(10rem, 32vmax, 32rem);
                animation: explode 2800ms var(--delay) ease-out both;
            }

            .explosions .boom {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                color: #ffe16b;
                font-family: "Arial Black", "Segoe UI", sans-serif;
                font-size: clamp(3rem, 19vw, 18rem);
                font-weight: 900;
                letter-spacing: -0.06em;
                -webkit-text-stroke: 2px #951e39;
                text-shadow:
                    0 8px 0 #951e39,
                    0 16px 40px #0009;
                animation: boom-zoom 4s ease-out both;
            }

            @keyframes boom-zoom {
                0% {
                    opacity: 0;
                    transform: scale(0.1) rotate(-12deg);
                }
                20% {
                    opacity: 1;
                    transform: scale(1.1) rotate(-6deg);
                }
                70% {
                    opacity: 1;
                    transform: scale(1.15) rotate(-6deg);
                }
                100% {
                    opacity: 0;
                    transform: scale(1.4);
                }
            }

            @keyframes explode {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.2);
                }
                25% {
                    opacity: 1;
                }
                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(1.8) rotate(20deg);
                }
            }

            .aside {
                margin: 16px;
                color: #a6b5d4;
                font-size: 0.7rem;
            }

            .confetti {
                position: fixed;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
                z-index: 1;
            }

            .confetti span {
                position: absolute;
                top: -24px;
                left: var(--left);
                width: 9px;
                height: 16px;
                background: var(--color);
                animation: confetti-fall var(--duration) var(--delay) ease-in
                    both;
            }

            @keyframes confetti-fall {
                from {
                    transform: translateY(-24px) rotate(0deg);
                }
                to {
                    transform: translate(var(--drift), calc(100vh + 48px))
                        rotate(720deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .confetti,
                .explosions {
                    display: none;
                }
            }

            .screenshots {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px;
                align-items: start;
            }

            .screenshots img {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid #40577f;
                border-radius: 16px;
                box-shadow: 0 16px 40px #0003;
            }

            @media (max-width: 700px) {
                main {
                    padding: 40px 20px;
                }
                h1 {
                    margin-bottom: 32px;
                }
                .screenshots {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>May you can say goodbye to it</h1>
            <p class="question">Have I said goodbye to my server yet?</p>
            <p class="aside" id="effects-warning">
                ⚠️ Visual effects warning when clicking "no" ⚠️
            </p>
            <button
                class="answer"
                type="button"
                aria-live="polite"
                aria-describedby="effects-warning"
            >
                NO
            </button>
            <p class="aside">obviously</p>
            <div class="screenshots">
                <img src="assets/1.png" alt="First Discord screenshot" />
                <img src="assets/2.png" alt="Second Discord screenshot" />
            </div>
            <footer>
                <p>You are a first class idiot and a disgrace to mankind</p>
            </footer>
        </main>
        <script>
            const answer = document.querySelector(".answer");
            const responses = [
                "STILL, NO.",
                "NICE TRY. NO.",
                "LOL. NO.",
                "NO, BUT LOUDER.",
                "ABSOLUTELY NOT.",
                "STILL HERE.",
                "NEIN.",
                "NEW CLICK. SAME NO.",
                "no but lower case.",
                "NEE.",
                "PLOT TWIST: NO.",
                "BREAKING NEWS: NO.",
                "404: YES NOT FOUND.",
                "NICE TRY BUT NO.",
                "NO. HOW TRAGIC.",
                "ASK AGAIN. STILL NO.",
                "CLOUDFLARE SAID NO.",
                "SORRY, NO.",
                "NOPE.",
                "NEGATIVE.",
                "NUH-UH.",
                "NEGATORY.",
                "Y- UH- NO.",
            ];
            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)",
            );
            let explosionTimer;

            answer.addEventListener("click", () => {
                const choices = responses.filter(
                    (response) => response !== answer.textContent,
                );
                answer.textContent =
                    choices[Math.floor(Math.random() * choices.length)];
                answer.classList.add("still");
                clearTimeout(explosionTimer);
                document.querySelector(".explosions")?.remove();
                if (reducedMotion.matches) return;

                const explosions = document.createElement("div");
                explosions.className = "explosions";
                explosions.setAttribute("aria-hidden", "true");
                const explosionCount = 24;
                const explosionDuration = 4000;

                for (let i = 0; i < explosionCount; i++) {
                    const burst = document.createElement("span");
                    burst.className = "burst";
                    burst.textContent = "💥";
                    burst.style.setProperty(
                        "--x",
                        `${(((i % 6) + Math.random()) / 6) * 100}%`,
                    );
                    burst.style.setProperty(
                        "--y",
                        `${((Math.floor(i / 6) + Math.random()) / 4) * 100}%`,
                    );
                    burst.style.setProperty("--delay", `${i * 50}ms`);
                    explosions.appendChild(burst);
                }

                const boom = document.createElement("div");
                boom.className = "boom";
                boom.textContent = "BOOM!";
                explosions.appendChild(boom);

                document.body.appendChild(explosions);
                explosionTimer = setTimeout(
                    () => explosions.remove(),
                    explosionDuration,
                );
            });

            if (
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.setAttribute("aria-hidden", "true");
                const colors = ["#a9c7ff", "#ff5c64", "#ffd479", "#c1a1ff"];
                const pieceCount = 60;

                for (let i = 0; i < pieceCount; i++) {
                    const piece = document.createElement("span");
                    piece.style.setProperty(
                        "--left",
                        `${Math.random() * 100}%`,
                    );
                    piece.style.setProperty(
                        "--color",
                        colors[i % colors.length],
                    );
                    piece.style.setProperty(
                        "--duration",
                        `${2 + Math.random() * 2}s`,
                    );
                    piece.style.setProperty("--delay", `${Math.random()}s`);
                    piece.style.setProperty(
                        "--drift",
                        `${Math.random() * 160 - 80}px`,
                    );
                    confetti.appendChild(piece);
                }

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        </script>
    </body>
</html>
